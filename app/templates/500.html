{% extends "base.html" %}

{% block title %}Internal Server Error - 500{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 text-center">
        <div class="d-inline-flex p-4 rounded-circle bg-danger bg-opacity-10 text-danger mb-4">
            <i class="bi bi-exclamation-octagon fs-1"></i>
        </div>
        <h1 class="display-5 fw-bold text-dark mb-2">500 - Server Error</h1>
        <p class="lead text-muted mb-4">
            An internal server error occurred while processing your request. The operations team has logged this incident.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('routes.dashboard') if current_user else url_for('auth.login') }}" class="btn btn-primary px-4">
                <i class="bi bi-house me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
