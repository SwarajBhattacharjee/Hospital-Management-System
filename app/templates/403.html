{% extends "base.html" %}

{% block title %}Access Denied - 403 Forbidden{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 text-center">
        <div class="d-inline-flex p-4 rounded-circle bg-warning bg-opacity-10 text-warning mb-4">
            <i class="bi bi-shield-x fs-1"></i>
        </div>
        <h1 class="display-5 fw-bold text-dark mb-2">403 - Forbidden</h1>
        <p class="lead text-muted mb-4">
            You do not have administrative permission or the necessary role to access this resource.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('routes.dashboard') if current_user else url_for('auth.login') }}" class="btn btn-primary px-4">
                <i class="bi bi-house me-1"></i> Return to Dashboard
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                <i class="bi bi-arrow-left me-1"></i> Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
