services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hms-application
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-only-change-me}
      - FLASK_ENV=production
      - PORT=5000
    volumes:
      # Persistent volume for SQLite instance database
      - hms_db_data:/app/instance
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hms_db_data:
    driver: local
