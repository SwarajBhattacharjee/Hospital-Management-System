global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'hms-application'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['hms-application:5000']
        labels:
          app: 'hospital-management-system'
          tier: 'backend'
          env: 'production'
